<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Internship Portal - Find internship opportunities in web development, Python and data science."
  >

  <title>Internship Portal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="container">
      <h1>Internship Portal</h1>
      <p>Find your next internship opportunity</p>
    </div>
  </header>

  <main class="container">

    <section aria-labelledby="search-heading">
      <h2 id="search-heading">Find an Internship</h2>

      <div class="filters">

        <div class="filter-group">
          <label for="search">Search internships</label>

          <input
            type="search"
            id="search"
            placeholder="Search by title or company"
            autocomplete="off"
          >
        </div>

        <div class="filter-group">
          <label for="domain">Filter by domain</label>

          <select id="domain">
            <option value="">All Domains</option>
            <option value="Web Development">Web Development</option>
            <option value="Python">Python</option>
            <option value="Data Science">Data Science</option>
          </select>
        </div>

      </div>
    </section>

    <section aria-labelledby="results-heading">

      <div class="results-header">
        <h2 id="results-heading">Available Internships</h2>

        <p
          id="resultsStatus"
          role="status"
          aria-live="polite"
        >
          Showing available internships
        </p>
      </div>

      <div
        id="internshipList"
        class="internship-list"
        aria-live="polite"
      ></div>

    </section>

  </main>

  <footer>
    <div class="container">
      <p>Internship Portal &copy; 2026</p>
      <p>Built with HTML, CSS and JavaScript</p>
    </div>
  </footer>

  <script src="script.js"></script>

</body>
</html>
